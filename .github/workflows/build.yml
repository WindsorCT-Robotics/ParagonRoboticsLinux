name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  wpilib-config:
    name: Read WPILib configuration
    runs-on: ubuntu-latest
    outputs:
      wpilib_version: ${{ steps.wpilib-config.outputs.wpilib_version }}
      wpilib_year: ${{ steps.wpilib-config.outputs.wpilib_year }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read WPILib configuration
        id: wpilib-config
        run: |
          CONFIG_FILE="files/build-configuration.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: build-configuration.json not found"
            exit 1
          fi
          WPILIB_VERSION=$(jq -r '.wpilib.version' "$CONFIG_FILE")
          WPILIB_YEAR=$(jq -r '.wpilib.year' "$CONFIG_FILE")
          echo "wpilib_version=$WPILIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "wpilib_year=$WPILIB_YEAR" >> "$GITHUB_OUTPUT"
          echo "WPILIB_VERSION=$WPILIB_VERSION"
          echo "WPILIB_YEAR=$WPILIB_YEAR"

  prepare-cache:
    name: Prepare shared build caches
    needs: wpilib-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore OnShape SVG Logo cache
        id: processed-onshape-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/share/icons/hicolor/scalable/apps/com.onshape.app.svg
          key: ${{ runner.os }}-onshape-logo-cache-v1

      - name: Download OnShape SVG Logo
        if: steps.processed-onshape-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p files/system/usr/share/icons/hicolor/scalable/apps/
          curl -L "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/onshape-dark.svg" -o files/system/usr/share/icons/hicolor/scalable/apps/com.onshape.app.svg

      - name: Save OnShape SVG Logo cache
        if: always() && steps.processed-onshape-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            files/system/usr/share/icons/hicolor/scalable/apps/com.onshape.app.svg
          key: ${{ runner.os }}-onshape-logo-cache-v1

      # Look for a cached WPILib installation, if it exists, to speed up builds
      - name: Restore WPILib & VS Code cache
        id: processed-frc-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/local/share/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}
            files/system/usr/share/applications/AdvantageScope_WPILib_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/DataLogTool_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/Elastic_WPILib_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/Glass_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/OutlineViewer_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/SysId_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/WPIcal_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/WPILib_Documentation_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
            files/system/usr/share/applications/WPILib_VS_Code_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
          key: processed-wpilib-${{ needs.wpilib-config.outputs.wpilib_version }}

      # On cache miss, download and install WPILib and VS Code
      - name: Generate WPILib & VS Code Installation on Cache Miss
        if: steps.processed-frc-cache.outputs.cache-hit != 'true'
        run: |
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          echo "Downloading combined installer package..."
          curl -L "https://packages.wpilib.workers.dev/installer/v${{ needs.wpilib-config.outputs.wpilib_version }}/WPILib_Linux-x64-${{ needs.wpilib-config.outputs.wpilib_version }}.tar.gz" | tar -xz --strip-components=1

          echo "Installing WPILib and VS Code..."
          chmod +x ./WPILibInstaller-CLI
          ./WPILibInstaller-CLI --install-mode all -y

          WPILIB_ROOT="$HOME/.local/share/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}"

          # --- Strip installer leftovers (created at install time, never written to) ---
          echo "Stripping installer leftovers..."
          if [ -d "$WPILIB_ROOT/data" ]; then
            rm -rf "$WPILIB_ROOT/data/user-data"
            rm -rf "$WPILIB_ROOT/data/shared-data"
            rm -f "$WPILIB_ROOT/data/argv.json"
          fi

          # --- Patch launcher: deterministic VS Code invocations (shared-data + extensions in-tree, code in home) ---
          echo "Patching launcher..."
          LAUNCHER="$WPILIB_ROOT/wpilibcode/wpilibcode${{ needs.wpilib-config.outputs.wpilib_year}}"
          if [ -f "$LAUNCHER" ]; then
            sed -i \
              -e 's|"$CODE_PATH" "$@"|"exec "$CODE_PATH" --user-data-dir "$HOME/.local/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}/code" --extensions-dir "$HOME/.local/state/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}/code/extensions" "$@"|' \
              -e 's|"$CODE_PATH" --no-sandbox "$@"|"exec "$CODE_PATH" --user-data-dir "$HOME/.local/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}/code" --extensions-dir "$HOME/.local/state/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}/code/extensions" --no-sandbox "$@"|' \
              "$LAUNCHER"
          fi

          # --- Move tree to ephemeral layer (/usr/local) ---
          echo "Moving WPILib tree to /usr/local..."
          mkdir -p "$GITHUB_WORKSPACE/files/system/usr/local/share/wpilib"
          cp -a "$WPILIB_ROOT" "$GITHUB_WORKSPACE/files/system/usr/local/share/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}"

          # --- Move installer-generated .desktop files to /usr/share/applications,
          # rewriting per-user home paths to the image's /usr/local tree ---
          echo "Moving WPILib desktop entries..."
          mkdir -p "$GITHUB_WORKSPACE/files/system/usr/share/applications"
          for f in "$HOME/.local/share/applications/"*_"${WPILIB_YEAR}".desktop; do
            [ -e "$f" ] || continue
            sed "s|/home/[^/]*/\.local/share/wpilib/|/usr/local/share/wpilib/|g" "$f" \
              > "$GITHUB_WORKSPACE/files/system/usr/share/applications/$(basename "$f")"
          done

          # --- AppArmor: chrome-sandbox (root:root 4755) + profile + marker ---
          echo "Setting up AppArmor..."
          CP="$WPILIB_ROOT/wpilibcode/wpilibcode${{ needs.wpilib-config.outputs.wpilib_year }}"
          CPDIR=$(dirname "$CP")
          if [ -f "$CPDIR/AppArmor/advantagescope" ]; then
            mkdir -p "$GITHUB_WORKSPACE/files/system/etc/apparmor.d"
            cp "$CPDIR/AppArmor/advantagescope" "$GITHUB_WORKSPACE/files/system/etc/apparmor.d/wpilib-advantagescope"
            touch "$GITHUB_WORKSPACE/files/system/etc/apparmor.wpilibcode"
          fi

          cd $GITHUB_WORKSPACE
          rm -rf "$TEMP_DIR"

      # Cache and install latest JetBrains Toolbox and Rider apps
      - name: Get latest JetBrains Toolbox and Rider versions
        id: jetbrains-versions
        run: |
          TBA_JSON=$(curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release')
          RD_JSON=$(curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=RD&latest=true&type=release')

          TOOLBOX_VERSION=$(printf '%s' "$TBA_JSON" | jq -r '.TBA[0].version')
          RIDER_VERSION=$(printf '%s' "$RD_JSON" | jq -r '.RD[0].version')

          echo "toolbox_version=$TOOLBOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "rider_version=$RIDER_VERSION" >> "$GITHUB_OUTPUT"

          echo "Discovered Live Toolbox Version: $TOOLBOX_VERSION"
          echo "Discovered Live Rider Version: $RIDER_VERSION"

      - name: Restore JetBrains cache
        id: processed-jetbrains-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/local/share/JetBrains/
            files/system/usr/share/applications/jetbrains-*.desktop
          key: jetbrains-cache-${{ steps.jetbrains-versions.outputs.toolbox_version }}-${{ steps.jetbrains-versions.outputs.rider_version }}

      - name: Download and Install JetBrains Toolbox and Rider on Cache Miss
        if: steps.processed-jetbrains-cache.outputs.cache-hit != 'true'
        run: |
          LOCAL_APPS="$GITHUB_WORKSPACE/files/system/usr/local/share/JetBrains"
          mkdir -p "$LOCAL_APPS"

          echo "Downloading JetBrains Toolbox..."
          TBX_URL=$(curl -s 'https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release' | jq -r '.TBA[0].downloads.linux.link')
          curl -L "$TBX_URL" | tar -xz -C "$LOCAL_APPS/Toolbox/bin" --strip-components=2

          echo "Downloading JetBrains Rider Engine..."
          RIDER_URL=$(curl -s 'https://data.services.jetbrains.com/products/releases?code=RD&latest=true&type=release' | jq -r '.RD[0].downloads.linux.link')
          curl -L "$RIDER_URL" | tar -xz -C "$LOCAL_APPS/apps/rider/bin" --strip-components=1

          # Seed Toolbox state with auto-update disabled (rebase is the only update path)
          bash "$GITHUB_WORKSPACE/files/scripts/setup-jetbrains-settings.sh" "$GITHUB_WORKSPACE/files/system/etc/skel/.local/share/JetBrains/Toolbox"

          # --- System .desktop files under /usr/share/applications ---
          cat << 'EOF' > "$GITHUB_WORKSPACE/files/system/usr/share/applications/jetbrains-rider.desktop"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=JetBrains Rider
          Comment=Cross-Platform .NET IDE
          Exec=/usr/local/share/JetBrains/apps/rider/bin/rider
          Icon=/usr/local/share/JetBrains/apps/rider/bin/rider.svg
          Terminal=false
          Categories=Development;IDE;
          StartupNotify=true
          EOF

          cat << 'EOF' > "$GITHUB_WORKSPACE/files/system/usr/share/applications/jetbrains-toolbox.desktop"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=JetBrains Toolbox
          Comment=Manage JetBrains IDEs
          Exec=/usr/local/share/JetBrains/Toolbox/bin/jetbrains-toolbox
          Icon=/usr/local/share/JetBrains/Toolbox/bin/toolbox.svg
          Terminal=false
          Categories=Development;IDE;
          StartupNotify=true
          EOF

      - name: Save JetBrains cache
        if: always() && steps.processed-jetbrains-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            files/system/usr/local/share/JetBrains/
            files/system/usr/share/applications/jetbrains-*.desktop
          key: jetbrains-cache-${{ steps.jetbrains-versions.outputs.toolbox_version }}-${{ steps.jetbrains-versions.outputs.rider_version }}

  bluebuild:
    needs: prepare-cache
    name: Build Paragon Robotics Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore OnShape SVG Logo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/share/icons/hicolor/scalable/apps/com.onshape.app.svg
          key: ${{ runner.os }}-onshape-logo-cache-v1

      - name: Restore WPILib & VS Code cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/local/share/wpilib/${{ needs.wpilib-config.outputs.wpilib_year }}
            files/system/usr/share/applications/AdvantageScope_WPILib_2027_alpha7.desktop
            files/system/usr/share/applications/DataLogTool_2027_alpha7.desktop
            files/system/usr/share/applications/Elastic_WPILib_2027_alpha7.desktop
            files/system/usr/share/applications/Glass_2027_alpha7.desktop
            files/system/usr/share/applications/OutlineViewer_2027_alpha7.desktop
            files/system/usr/share/applications/SysId_2027_alpha7.desktop
            files/system/usr/share/applications/WPIcal_2027_alpha7.desktop
            files/system/usr/share/applications/WPILib_Documentation_2027_alpha7.desktop
            files/system/usr/share/applications/WPILib_VS_Code_${{ needs.wpilib-config.outputs.wpilib_year }}.desktop
          key: processed-wpilib-${{ needs.wpilib-config.outputs.wpilib_version }}

      - name: Restore JetBrains cache
        uses: actions/cache/restore@v6
        with:
          path: |
            files/system/usr/local/share/JetBrains/
            files/system/usr/share/applications/jetbrains-*.desktop
          key: jetbrains-cache-${{ steps.jetbrains-versions.outputs.toolbox_version }}-${{ steps.jetbrains-versions.outputs.rider_version }}

      # Set up Vivaldi custom profile
      - name: Inject Team Vivaldi Configuration Profile
        run: |
          VIVALDI_SKEL_DIR="files/system/etc/skel/.var/app/com.vivaldi.Vivaldi/config/vivaldi/Default"
          mkdir -p "$VIVALDI_SKEL_DIR"

          # 1. Inject the Privacy Preferences file (Enables internal ad/tracker blocker blocks)
          cat << 'EOF' > "$VIVALDI_SKEL_DIR/Preferences"
          {
            "vivaldi": {
              "ad_blocking": {
                "ad_block_level": 2,
                "tracker_block_level": 2
              }
            },
            "privacy": {
              "donottrack": {
                "enabled": true
              }
            }
          }
          EOF

          # 2. Inject the FRC Team Bookmark Index File
          cat << 'EOF' > "$VIVALDI_SKEL_DIR/Bookmarks"
          {
             "checksum": "",
             "roots": {
                "bookmark_bar": {
                   "children": [
                      {
                         "name": "The Blue Alliance",
                         "type": "url",
                         "url": "https://thebluealliance.com"
                      },
                      {
                         "name": "Team GitHub Repository",
                         "type": "url",
                         "url": "https://github.com/WindsorCT-Robotics"
                      },
                      {
                         "name": "Team Codeberg Repository",
                         "type": "url",
                         "url": "https://codeberg.org/WindsorCT-Robotics"
                      }
                   ],
                   "name": "Bookmark Bar",
                   "type": "folder"
                }
             },
             "version": 1
          }
          EOF

      # the build is fully handled by the reusable github action
      - name: Build Paragon Robotics Linux
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true